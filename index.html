<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campfire Survival kaartspel prototype</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="start-screen" class="screen screen-active">
      <section class="start-panel">
        <div>
          <p class="eyebrow">Digitaal kaartspel prototype</p>
          <h1>Campfire Survival</h1>
          <p class="intro">
            Kies het aantal spelers, vul namen in en speel het hele potje op een laptop of tablet.
          </p>
        </div>

        <div class="setup-block">
          <h2>Aantal spelers</h2>
          <div class="count-picker" aria-label="Aantal spelers kiezen">
            <button type="button" class="count-button is-selected" data-count="3">3 spelers</button>
            <button type="button" class="count-button" data-count="4">4 spelers</button>
            <button type="button" class="count-button" data-count="5">5 spelers</button>
          </div>
        </div>

        <form id="setup-form" class="setup-form">
          <div id="name-fields" class="name-grid"></div>
          <button type="submit" class="primary-button">Start spel</button>
        </form>
      </section>
    </div>

    <div id="game-screen" class="screen">
      <header class="app-header">
        <div>
          <p class="eyebrow">Campfire Survival</p>
          <h1>Kaarttafel</h1>
        </div>
        <div class="header-actions">
          <button type="button" class="secondary-button" data-action="open-rules">Spelregels</button>
          <button type="button" class="danger-button" data-action="force-endgame">Spel nu beëindigen</button>
        </div>
      </header>

      <section id="game-status" class="status-grid" aria-live="polite"></section>

      <main class="table-layout">
        <section class="active-column">
          <div id="handoff-panel" class="handoff-panel"></div>
          <div id="private-panel" class="private-panel"></div>
          <div id="action-panel" class="action-panel"></div>
        </section>

        <aside class="public-column">
          <div class="section-heading">
            <h2>Spelers</h2>
          </div>
          <div id="players-overview" class="players-overview"></div>
        </aside>
      </main>

      <section class="lower-grid">
        <details id="debug-details" class="debug-panel">
          <summary>Debugpaneel</summary>
          <div id="debug-content"></div>
        </details>

        <section class="log-panel">
          <div class="section-heading">
            <h2>Logboek</h2>
          </div>
          <ol id="event-log" class="event-log"></ol>
        </section>
      </section>
    </div>

    <div id="score-screen" class="screen">
      <header class="app-header">
        <div>
          <p class="eyebrow">Eindscore</p>
          <h1>Uitslag</h1>
        </div>
        <div class="header-actions">
          <button type="button" class="secondary-button" data-action="open-rules">Spelregels</button>
          <button type="button" class="primary-button" data-action="reset-game">Nieuw spel</button>
        </div>
      </header>
      <section id="score-content" class="score-content"></section>
    </div>

    <div id="modal-root" class="modal-root" aria-hidden="true"></div>

    <script src="game.js"></script>
  </body>
</html>
